# ===== 站点信息 =====
title: 1_LARA 的一隅
email: windycatelara@gmail.com
description: >-
  在寻求理解的路上走了很远, 我们才终于发现孤独是生命的本质; 即便如此, 我们仍然发明了语言, 绘画, 音乐......
author: 1_LARA

# 部署地址。本地预览时留空；部署到线上后填写完整域名。
# 这是用户站点仓库（1-LARA/1-LARA.github.io），部署在域名根目录，
# 因此 baseurl 必须为空。项目站点才需要设置 baseurl: "/仓库名"。
url: "https://1-lara.github.io"
baseurl: ""

github_username: "1-LARA"
twitter_username: ""

# 友链页的 GitHub 讨论区入口
# 请确认仓库已开启 Discussions，并替换为你的实际仓库地址
github_discussions_url: "https://github.com/1-LARA/1-LARA.github.io/discussions"

# GitHub Discussions 评论区（由 giscus 提供）
giscus:
  repo: "1-LARA/1-LARA.github.io"
  repo_id: "R_kgDOV566Zw"
  category: "Announcements"
  category_id: "DIC_kwDOV566Z84DL3M0"
  lang: "zh-CN"

# ===== 构建设置 =====
markdown: kramdown
highlighter: rouge

# 文章永久链接格式：/年/月/日/标题/
permalink: /:year/:month/:day/:title/

timezone: Asia/Shanghai
future: false
show_drafts: false

# Textile 支持（.textile 文章需要该转换器）
plugins:
  - jekyll-textile-converter

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# 摘要分隔符：文章中插入 <!--more--> 可在首页截断
excerpt_separator: "<!--more-->"

# ===== 默认值 =====
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ===== 排除文件 =====
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .jekyll-cache
