<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    <title>{% if page.title and page.title != "首页" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% if jekyll.environment == "production" and site.url != "" %}
      <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% endif %}
  </head>
  <body{% if page.background_image %} class="has-page-bg" style="--page-bg-image: url('{{ page.background_image | relative_url }}');{% if page.background_position %} --page-bg-position: {{ page.background_position }};{% endif %}"{% endif %}>
    {% include header.html %}

    {% if page.hero_image %}
      <section class="hero" aria-label="主页主题图">
        <picture>
          {% if page.hero_image_webp %}
            <source srcset="{{ page.hero_image_webp | relative_url }}" type="image/webp">
          {% endif %}
          <img class="hero-image"
               src="{{ page.hero_image | relative_url }}"
               alt="{{ page.hero_alt | default: site.title }}"
               {% if page.hero_width and page.hero_height %}width="{{ page.hero_width }}" height="{{ page.hero_height }}"{% endif %}
               fetchpriority="high"
               decoding="async">
        </picture>
        {% if page.hero_title %}
          <div class="hero-overlay">
            <h1 class="hero-title">{{ page.hero_title }}</h1>
          </div>
        {% endif %}
      </section>
    {% endif %}

    <main class="wrapper page-content{% if page.body_class %} {{ page.body_class }}{% endif %}" id="main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
  </body>
</html>
