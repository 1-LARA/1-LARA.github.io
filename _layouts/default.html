<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (error) {}
        if (theme !== "dark" && theme !== "light") theme = "dark";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    <title>{% if page.title and page.title != "首页" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <noscript>
      <style>
        @media (max-width: 700px) {
          .site-header .site-nav {
            position: static;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.8rem;
            padding: 0;
            border: 0;
            background: none;
            box-shadow: none;
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
          }

          .menu-toggle {
            display: none !important;
          }

          .site-header .site-nav a {
            padding: 0;
            border: 0;
            font-size: 0.9rem;
          }
        }
      </style>
    </noscript>
    {% if jekyll.environment == "production" and site.url != "" %}
      <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% endif %}
  </head>
  <body{% if page.background_image %} class="has-page-bg{% if page.background_tone == 'dark' %} has-page-bg-dark{% endif %}" style="--page-bg-image: url('{{ page.background_image | relative_url }}');{% if page.background_position %} --page-bg-position: {{ page.background_position }};{% endif %}"{% endif %}>
    {% include header.html %}

    {% if page.hero_image %}
      <section class="hero" aria-label="页面主题图"{% if page.hero_position %} style="--hero-position: {{ page.hero_position }};"{% endif %}>
        <picture>
          {% if page.hero_image_webp %}
            <source srcset="{{ page.hero_image_webp | relative_url }}?v={{ site.time | date: '%s' }}" type="image/webp">
          {% endif %}
          <img class="hero-image"
               src="{{ page.hero_image | relative_url }}?v={{ site.time | date: '%s' }}"
               alt="{{ page.hero_alt | default: site.title }}"
               {% if page.hero_width and page.hero_height %}width="{{ page.hero_width }}" height="{{ page.hero_height }}"{% endif %}
               fetchpriority="high"
               decoding="async">
        </picture>
        {% if page.hero_title %}
          <div class="hero-overlay">
            <h1 class="hero-title">{{ page.hero_title }}</h1>
          </div>
        {% endif %}
      </section>
    {% endif %}

    <main class="wrapper page-content{% if page.body_class %} {{ page.body_class }}{% endif %}" id="main">
      {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
    <script src="{{ '/assets/js/search.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
