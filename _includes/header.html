<header class="site-header">
  <div class="wrapper header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="is-active" aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/categories/' | relative_url }}"{% if page.url == "/categories/" %} class="is-active" aria-current="page"{% endif %}>分类</a>
      <a href="{{ '/friends/' | relative_url }}"{% if page.url == "/friends/" %} class="is-active" aria-current="page"{% endif %}>友链</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} class="is-active" aria-current="page"{% endif %}>关于</a>
      {% if site.github_username and site.github_username != "" %}
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      {% endif %}
    </nav>

    <div class="site-search" data-search data-index-url="{{ '/search.json' | relative_url }}">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>
      </svg>
      <input class="search-input" type="search" placeholder="搜索文章…"
             aria-label="搜索文章" aria-controls="search-results"
             aria-expanded="false" role="combobox" aria-autocomplete="list"
             autocomplete="off" spellcheck="false">
      <div class="search-results" id="search-results" role="listbox"
           aria-label="搜索结果" hidden></div>
    </div>

    <button class="theme-toggle" type="button" data-theme-toggle
            aria-label="切换到浅色模式" aria-pressed="true" title="切换到浅色模式">
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <button class="menu-toggle" type="button" data-menu-toggle
            aria-label="打开导航菜单" aria-expanded="false" aria-controls="site-nav"
            title="打开导航菜单">
      <svg class="menu-icon menu-icon-open" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      <svg class="menu-icon menu-icon-close" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
  </div>
</header>
